name: nightly snapshot

# MCX publishes the bhavcopy after the evening session closes (23:30 / 23:55 IST).
# 18:45 UTC = 00:15 IST, Monday to Friday.
on:
  schedule:
    - cron: "45 18 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "synthetic, csv, live or db"
        default: synthetic

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Keep yesterday's snapshot so the Telegram step only reports changes.
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/processed/snapshot.json
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-

      - name: Build snapshot and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MCX_DB_HOST: ${{ secrets.MCX_DB_HOST }}
          MCX_DB_PORT: ${{ secrets.MCX_DB_PORT }}
          MCX_DB_USER: ${{ secrets.MCX_DB_USER }}
          MCX_DB_PASSWORD: ${{ secrets.MCX_DB_PASSWORD }}
          MCX_DB_NAME: ${{ secrets.MCX_DB_NAME }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'synthetic' }}"
          if [ "$SOURCE" = "synthetic" ]; then
            python scripts/nightly.py --source synthetic
          else
            python scripts/nightly.py --source "$SOURCE" --end "$(date -u +%F)"
          fi

      - name: Save snapshot for tomorrow's diff
        uses: actions/cache/save@v4
        with:
          path: data/processed/snapshot.json
          key: snapshot-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_number }}
          path: |
            data/processed/snapshot.json
            data/processed/history/
          retention-days: 30

      # Optional: ping the hosted API (e.g. a Render deploy hook) to pick up the new file.
      - name: Notify the API host
        env:
          DEPLOY_HOOK: ${{ secrets.SNAPSHOT_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -X POST "$DEPLOY_HOOK"; else echo "no deploy hook set"; fi
