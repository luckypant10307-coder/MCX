name: nightly snapshot

# The daily routine, with real MCX data:
#   1. download new bhavcopy sessions (mtf.trading), keeping earlier ones in a cache
#   2. read today's published margin rates, build the snapshot over the full history
#   3. notify: owner channels (ntfy / Telegram) and every registered user (Supabase:
#      notification centre + web push), only for what changed
#   4. rebuild the Render site, but only when a new session actually arrived
#
# Twice per weekday: 00:15 IST after the MCX evening session, and 09:00 IST to pick up
# a session the source published late. Messages only go out on a change, so a second
# run with nothing new sends nothing.
on:
  schedule:
    - cron: "45 18 * * 1-5"    # 00:15 IST, Tue-Sat
    - cron: "30 3 * * 2-6"     # 09:00 IST, Tue-Sat
  workflow_dispatch:
    inputs:
      source:
        description: "csv (real MCX data, default) or synthetic (sample data, no notifications)"
        default: csv
      force_deploy:
        description: "rebuild the Render site even if no new session arrived"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ github.event.inputs.source || 'csv' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-api.txt

      # Every session downloaded so far, so each run only fetches what is new.
      - name: Restore bhavcopy archive
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bhavcopy-${{ github.run_id }}
          restore-keys: bhavcopy-

      # Yesterday's snapshot (for the change-only notifications), the list of
      # circular links already seen, and the published margin rates gathered so far
      # (newer than the copy committed in the repo).
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed/snapshot.json
            data/processed/circulars_seen.json
            data/reference/published_margins.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Remember the previous session
        id: before
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          p = "data/processed/snapshot.json"
          asof = json.load(open(p))["meta"]["asof"] if os.path.exists(p) else ""
          print(f"asof={asof}")
          EOF

      - name: Download new MCX sessions
        if: env.SOURCE == 'csv'
        run: python scripts/fetch_mtf.py

      - name: Build snapshot and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ "$SOURCE" = "synthetic" ]; then
            # Sample data never notifies anyone.
            python scripts/nightly.py --source synthetic --no-notify
          else
            python scripts/nightly.py --source csv --csv-dir data/raw
          fi

      - name: Did a new session arrive?
        id: after
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          asof = json.load(open("data/processed/snapshot.json"))["meta"]["asof"]
          print(f"asof={asof}")
          EOF
          echo "before: ${{ steps.before.outputs.asof }}"

      - name: Save bhavcopy archive
        if: always() && env.SOURCE == 'csv'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: bhavcopy-${{ github.run_id }}

      - name: Save state for the next run
        if: env.SOURCE == 'csv'
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed/snapshot.json
            data/processed/circulars_seen.json
            data/reference/published_margins.json
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_number }}
          path: data/processed/snapshot.json
          retention-days: 30

      # The Render image downloads the data itself at build time, so a deploy IS the
      # refresh. Only trigger it when there is something new to show.
      - name: Rebuild the live site
        if: >-
          env.SOURCE == 'csv' && (steps.after.outputs.asof != steps.before.outputs.asof
          || github.event.inputs.force_deploy == 'true')
        env:
          DEPLOY_HOOK: ${{ secrets.SNAPSHOT_DEPLOY_HOOK }}
        run: |
          echo "session ${{ steps.before.outputs.asof }} -> ${{ steps.after.outputs.asof }}"
          if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -X POST "$DEPLOY_HOOK" && echo "Render rebuild triggered"
          else echo "SNAPSHOT_DEPLOY_HOOK secret not set: the live site was not refreshed"; fi
