name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcx
          POSTGRES_PASSWORD: mcx
          POSTGRES_DB: mcx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcx" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MCX_DB_HOST: localhost
      MCX_DB_PORT: "5432"
      MCX_DB_USER: mcx
      MCX_DB_PASSWORD: mcx
      MCX_DB_NAME: mcx_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-api.txt pytest httpx
      - name: API imports cleanly
        run: python -c "import api.main"
      - run: python -m pytest -q
