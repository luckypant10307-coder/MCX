# Render Blueprint. In the Render Dashboard: New > Blueprint, pick this repo.
#
# The image downloads the MCX data and builds the snapshot during the build (see
# Dockerfile), so a deploy IS a data refresh. To refresh nightly, copy this
# service's Deploy Hook URL into the GitHub secret SNAPSHOT_DEPLOY_HOOK; the
# "nightly snapshot" workflow calls it.
services:
  - type: web
    name: mcx-gold-spread-monitor
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      # Accounts and notifications. "sync: false" = set the value in the Render
      # dashboard (Environment tab); it is never stored in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
