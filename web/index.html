<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCX Gold Relative Value</title>
<style>
/* Layout: findings first, monitoring second. One column of evidence, each chart answering one question. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --accent: #b7791f; --accent-soft: #f6ecd9;
  /* categorical (premium lines): reference slots 1-3, validated all-pairs */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  /* ordinal |z| bands: one blue hue, light -> dark, validated --ordinal */
  --o1: #86b6ef; --o2: #5598e7; --o3: #256abf; --o4: #104281;
  /* diverging poles (net per trade by year) */
  --pos: #2a78d6; --neg: #e34948;
  /* status: always paired with an icon and a label */
  --good: #0ca30c; --good-ink: #006300; --good-bg: #e7f6e7;
  --bad: #d03b3b; --bad-bg: #fbeaea;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-bg: #fdf3dc;
  --neutral-bg: #f0efec;
  --band: rgba(42,120,214,0.10);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #1f1f1e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #e0a83a; --accent-soft: #33291a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --o1: #184f95; --o2: #2a78d6; --o3: #5598e7; --o4: #9ec5f4;
    --pos: #3987e5; --neg: #e66767;
    --good-ink: #0ca30c; --good-bg: #13260f; --bad-bg: #2e1616;
    --warn-ink: #fab219; --warn-bg: #2e2510; --neutral-bg: #383835;
    --band: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #1f1f1e;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #e0a83a; --accent-soft: #33291a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --o1: #184f95; --o2: #2a78d6; --o3: #5598e7; --o4: #9ec5f4;
  --pos: #3987e5; --neg: #e66767;
  --good-ink: #0ca30c; --good-bg: #13260f; --bad-bg: #2e1616;
  --warn-ink: #fab219; --warn-bg: #2e2510; --neutral-bg: #383835;
  --band: rgba(57,135,229,0.16);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
.bar { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding-block: 12px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 17px; letter-spacing: -0.01em; }
.brand .au { font: 700 12px var(--mono); color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; }
.meta { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
.pill.real { background: var(--good-bg); color: var(--good-ink); }
.pill.sample { background: var(--warn-bg); color: var(--warn-ink); }
nav { width: 100%; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav a { padding: 10px 12px 11px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a:hover { color: var(--ink); }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
nav a:focus-visible, button:focus-visible, summary:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
main { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
h1 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 70ch; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 18px 20px; min-width: 0; display: grid; gap: 12px; }
.card > header { display: grid; gap: 4px; }
.card > header p { margin: 0; color: var(--ink-2); max-width: 75ch; }
.q { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.grid2 { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.hero { display: grid; gap: 14px; }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; background: var(--bad-bg); }
.verdict.ok { background: var(--good-bg); }
.verdict .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; background: var(--bad); }
.verdict.ok .ic { background: var(--good); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tile .l { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0; }
.tile .s { font-size: 13px; color: var(--muted); }
.neg { color: var(--neg); } .posv { color: var(--pos); }
.chart { position: relative; }
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
/* Below ~620px a scaled-down chart's labels drop under legible size; keep it at a
   readable width and let it scroll inside its own box instead. */
@media (max-width: 620px) { .chart svg { min-width: 600px; } }
.chart text { font: 11px var(--font); fill: var(--muted); }
.chart .lbl { font-size: 12px; fill: var(--ink-2); font-weight: 600; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; opacity: .5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; border: 0; }
.legend i.box { width: 12px; height: 10px; border: 0; border-radius: 2px; }
.note { font-size: 13px; color: var(--ink-2); margin: 0; max-width: 80ch; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--raised); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 6px 20px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; min-width: 140px; max-width: 280px; }
.tip .h { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r i { width: 12px; height: 0; border-top: 2px solid; flex: none; }
.tip .r span { color: var(--ink-2); }
details { font-size: 13px; }
summary { cursor: pointer; color: var(--ink-2); width: fit-content; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.go { cursor: pointer; } tr.go:hover td { background: var(--neutral-bg); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.chip.ALERT, .chip.TRADED { background: var(--good-bg); color: var(--good-ink); }
.chip.NO_TRADE { background: var(--warn-bg); color: var(--warn-ink); }
.chip.QUIET, .chip.SIGNAL { background: var(--neutral-bg); color: var(--ink-2); }
.chip.WARMUP { background: var(--neutral-bg); color: var(--muted); }
.zt { position: relative; height: 18px; min-width: 150px; }
.zt .track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--grid); }
.zt .zone { position: absolute; top: 4px; height: 10px; background: var(--neutral-bg); border-radius: 2px; }
.zt .mid { position: absolute; top: 3px; width: 1px; height: 12px; background: var(--axis); }
.zt .dot { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink-2); box-shadow: 0 0 0 2px var(--surface); }
.zt .dot.hot { background: var(--accent); }
.prop { display: flex; height: 26px; border-radius: 5px; overflow: hidden; gap: 2px; }
.prop div { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; min-width: 0; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.back { border: 1px solid var(--ring); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: 600 13px var(--font); cursor: pointer; width: fit-content; }
.err { padding: 16px; border-radius: 10px; background: var(--bad-bg); }
.gates { display: grid; gap: 6px; }
.gate { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.gate b { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; flex: none; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--ink-2); } dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { tr.go td, nav a { transition: background .12s, color .12s; } }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand"><span class="au">Au</span><b>MCX Gold Relative Value</b></div>
    <div class="meta" id="meta">Connecting…</div>
    <nav id="nav" aria-label="Sections">
      <a href="#/findings" data-r="findings">Findings</a>
      <a href="#/today" data-r="today">Today</a>
      <a href="#/backtest" data-r="backtest">Backtest</a>
      <a href="#/data" data-r="data">Data</a>
    </nav>
  </div>
</div>
<main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
<div class="tip" id="tip" hidden></div>

<script>
// API base: same origin by default; override with ?api=https://your-api.example
const API = (new URLSearchParams(location.search).get("api") || window.MCX_API || "").replace(/\/$/, "");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fin = v => v != null && Number.isFinite(Number(v));
const bp = (v, d = 1) => fin(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + " bp" : "–";
const num = (v, d = 2) => fin(v) ? (v < 0 ? "−" : "") + Math.abs(v).toFixed(d) : "–";
const inr = v => fin(v) ? (v < 0 ? "−₹" : "₹") + Math.abs(Math.round(v)).toLocaleString("en-IN") : "–";
const lakh = v => fin(v) ? (v < 0 ? "−" : "") + "₹" + (Math.abs(v) / 1e5).toFixed(2) + " L" : "–";
const pct = (v, d = 0) => fin(v) ? (v * 100).toFixed(d) + "%" : "–";
const fdate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}) : "–";
const fmon = ms => new Date(ms).toLocaleDateString("en-GB", {month: "short", year: "2-digit"});
const ms = d => new Date(d + "T00:00:00").getTime();
const BANDS = [["|z| 0-1", "|z| below 1", "--o1"], ["|z| 1-2", "|z| 1 to 2", "--o2"], ["|z| 2-3", "|z| 2 to 3", "--o3"], ["|z| 3-inf", "|z| 3 and above", "--o4"]];
const PREM = [["GOLDGUINEA", "--s1"], ["GOLDPETAL", "--s2"], ["GOLDTEN", "--s3"]];
const STATUS_ICON = {ALERT: "●", TRADED: "●", NO_TRADE: "▲", QUIET: "○", SIGNAL: "○", WARMUP: "◌"};
const chip = s => `<span class="chip ${esc(s)}"><span aria-hidden="true">${STATUS_ICON[s] || ""}</span>${esc(String(s).replace("_", " ").toLowerCase())}</span>`;
const GATES = {gate_history: "Enough history", gate_stationary: "Spread mean-reverts (ADF)", gate_halflife: "Half-life fits the contract", gate_magnitude: "Gap beats the noise floor"};

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status + " " + r.statusText);
  return r.json();
}
const cache = {};
const once = path => cache[path] || (cache[path] = get(path).catch(e => { delete cache[path]; throw e; }));

// ------------------------------------------------------------------ tooltip
const tip = $("#tip");
function showTip(x, y, head, rows) {
  tip.replaceChildren();
  const h = document.createElement("div"); h.className = "h"; h.textContent = head; tip.append(h);
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "r";
    if (r.color) { const i = document.createElement("i"); i.style.borderColor = `var(${r.color})`; if (r.dash) i.style.borderTopStyle = "dashed"; row.append(i); }
    const b = document.createElement("b"); b.textContent = r.value; row.append(b);
    if (r.label) { const s = document.createElement("span"); s.textContent = r.label; row.append(s); }
    tip.append(row);
  }
  tip.hidden = false;
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - hgt - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };

// ------------------------------------------------------------------ chart helpers
function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const t = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-9; v += step) t.push(+v.toFixed(10));
  if (t[0] > lo) t.unshift(t[0] - step);
  if (t[t.length - 1] < hi) t.push(t[t.length - 1] + step);
  return t;
}
const CHARTS = {};
let chartSeq = 0;
/*
 * Line chart. series: [{name, color (css var), values: [[x, y]...], dash, width}]
 * opts: {W, H, xType: "date"|"num", xTicks, xFmt, yFmt, yUnit, refs: [{y, label}],
 *        band: {color, lo: [[x,y]], hi: [[x,y]]}, endLabels: bool, zero: bool, xLabel, tipHead}
 */
function lineChart(series, o) {
  const id = "c" + (++chartSeq), W = o.W || 720, H = o.H || 300;
  const pl = o.pl || 52, pr = o.endLabels ? 112 : 16, pt = 12, pb = o.xLabel ? 44 : 28;
  const pts = series.flatMap(s => s.values).concat(o.band ? o.band.lo.concat(o.band.hi) : []);
  const xs = [...new Set(series.flatMap(s => s.values.map(v => v[0])))].sort((a, b) => a - b);
  if (!xs.length) return `<p class="muted">No data.</p>`;
  let ylo = Math.min(...pts.map(p => p[1]), ...(o.refs || []).map(r => r.y)), yhi = Math.max(...pts.map(p => p[1]), ...(o.refs || []).map(r => r.y));
  if (o.zero) { ylo = Math.min(ylo, 0); yhi = Math.max(yhi, 0); }
  const yt = niceTicks(ylo, yhi), y0 = yt[0], y1 = yt[yt.length - 1];
  const x0 = o.xMin ?? xs[0], x1 = o.xMax ?? xs[xs.length - 1];
  const X = x => pl + (W - pl - pr) * (x - x0) / ((x1 - x0) || 1), Y = y => pt + (H - pt - pb) * (y1 - y) / ((y1 - y0) || 1);
  const path = vals => vals.map((v, i) => (i ? "L" : "M") + X(v[0]).toFixed(1) + "," + Y(v[1]).toFixed(1)).join("");
  const yFmt = o.yFmt || (v => v), xFmt = o.xFmt || (v => v);
  let g = "";
  for (const t of yt) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
  const xticks = o.xTicks || (o.xType === "date" ? dateTicks(x0, x1) : xs);
  for (const t of xticks) g += `<text x="${X(t)}" y="${H - pb + 18}" text-anchor="middle">${esc(xFmt(t))}</text>`;
  g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>`;
  if (o.zero && y0 < 0 && y1 > 0) g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (o.xLabel) g += `<text x="${pl + (W - pl - pr) / 2}" y="${H - 6}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  if (o.band) {
    const up = o.band.hi.map(v => X(v[0]).toFixed(1) + "," + Y(v[1]).toFixed(1));
    const dn = o.band.lo.slice().reverse().map(v => X(v[0]).toFixed(1) + "," + Y(v[1]).toFixed(1));
    g += `<polygon points="${up.concat(dn).join(" ")}" style="fill:var(--band)"/>`;
  }
  for (const r of o.refs || []) g += `<line class="ref" x1="${pl}" x2="${W - pr}" y1="${Y(r.y)}" y2="${Y(r.y)}"/><text class="lbl" x="${W - pr - 4}" y="${Y(r.y) - 6}" text-anchor="end">${esc(r.label)}</text>`;
  for (const s of series) {
    g += `<path d="${path(s.values)}" fill="none" style="stroke:var(${s.color})" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ""}/>`;
    if (s.markers) for (const v of s.values) g += `<circle cx="${X(v[0])}" cy="${Y(v[1])}" r="4" style="fill:var(${s.color});stroke:var(--surface)" stroke-width="2"/>`;
  }
  if (o.endLabels) {
    const ends = series.map(s => ({s, y: Y(s.values[s.values.length - 1][1])})).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
    for (const e of ends) g += `<text class="lbl" x="${W - pr + 8}" y="${e.y + 4}">${esc(e.s.label || e.s.name)}</text>`;
  }
  g += `<line class="xh" id="${id}-xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" visibility="hidden"/>`;
  g += `<rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" data-chart="${id}" tabindex="0" aria-label="${esc(o.aria || "chart")}; use the table view for exact values"/>`;
  CHARTS[id] = {series, xs, X, W, pl, pr, xFmt: o.tipX || xFmt, yFmt: o.tipY || yFmt};
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "")}">${g}</svg></div>`;
}
function dateTicks(a, b) {
  const t = [], d = new Date(a); d.setDate(1);
  const months = (b - a) / 2.63e9, step = months > 40 ? 12 : months > 18 ? 6 : months > 8 ? 3 : 1;
  d.setMonth(Math.ceil(d.getMonth() / step) * step);
  while (d.getTime() <= b) { if (d.getTime() >= a) t.push(d.getTime()); d.setMonth(d.getMonth() + step); }
  return t;
}
// Crosshair: snap to the nearest x, list every series at that x.
function chartMove(e, rect) {
  const c = CHARTS[rect.dataset.chart]; if (!c) return;
  const svg = rect.ownerSVGElement, box = svg.getBoundingClientRect(), sx = (e.clientX - box.left) * c.W / box.width;
  let best = c.xs[0], bd = Infinity;
  for (const x of c.xs) { const d = Math.abs(c.X(x) - sx); if (d < bd) { bd = d; best = x; } }
  const xh = svg.querySelector("#" + rect.dataset.chart + "-xh");
  xh.setAttribute("x1", c.X(best)); xh.setAttribute("x2", c.X(best)); xh.setAttribute("visibility", "visible");
  const rows = c.series.map(s => { const v = s.values.find(p => p[0] === best); return v ? {color: s.color, dash: s.dash, value: c.yFmt(v[1]), label: s.name} : null; }).filter(Boolean);
  showTip(e.clientX, e.clientY, c.xFmt(best), rows);
}
document.addEventListener("pointermove", e => {
  const t = e.target;
  if (t.dataset && t.dataset.chart) return chartMove(e, t);
  const m = t.closest && t.closest("[data-tip]");
  if (m) { const d = JSON.parse(m.dataset.tip); return showTip(e.clientX, e.clientY, d.h, d.r); }
  document.querySelectorAll(".xh").forEach(x => x.setAttribute("visibility", "hidden"));
  hideTip();
});
document.addEventListener("focusin", e => {
  const t = e.target;
  if (t.dataset && t.dataset.chart) { const r = t.getBoundingClientRect(); chartMove({clientX: r.right - 10, clientY: r.top + 10}, t); }
});
document.addEventListener("focusout", hideTip);
const tipAttr = (h, r) => ` data-tip="${esc(JSON.stringify({h, r}))}"`;
const legend = items => `<div class="legend">${items.map(i => `<span><i class="${i.kind || ""}" style="${i.kind === "dot" || i.kind === "box" ? "background" : "border-color"}:var(${i.color})"></i>${esc(i.name)}</span>`).join("")}</div>`;
const tableView = (head, rows) => `<details><summary>Table view</summary><div class="tw"><table><tr>${head.map((h, i) => `<th class="${i ? "num" : ""}">${esc(h)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div></details>`;

    html += `<section class="card"><header><span class="q">1 · Is the signal real?</span><h2>Wide spreads do close, and wider ones close further</h2>
      <p>Average convergence after a dislocation, by how extreme it was (|z|) and how long you wait. Every pair-day counts, tradable or not. The shaded band is the 95% bootstrap interval for |z| ≥ 3.</p></header>
      ${legend(series.map(s => ({name: s.name, color: s.color}))
        .concat([{name: "round-trip cost at " + es.half_spread_bp + " bp spread", color: "--ink-2", kind: "dash"}]))}
      ${lineChart(series, {W: 760, H: 320, xTicks: hz, xFmt: v => v + "", tipX: v => "after " + v + " session" + (v === 1 ? "" : "s"), yFmt: v => v + " bp", tipY: v => bp(v),
        refs: [{y: es.round_trip_bp, label: "cost " + es.round_trip_bp.toFixed(0) + " bp"}], zero: true, xLabel: "sessions held",
        band: {lo: top.map(r => [r.horizon, r.boot_ci_lo]), hi: top.map(r => [r.horizon, r.boot_ci_hi])}, endLabels: true,

      <p class="note">${clears.length ? `Only ${clears.map(r => esc(r.z_band.replace("|z| 3-inf", "|z| ≥ 3")) + " held " + r.horizon + " sessions").join(", ")} clears the cost line with 95% confidence.` : "No band and horizon clears the cost line with 95% confidence."} The backtest rarely holds that long: ${R.exit_reasons ? `${R.exit_reasons.stop || 0} of ${p.n_trades} trades were stopped out after the spread widened further` : "most trades exit early"}.</p>

    html += `<section class="card"><header><span class="q">3 · What is not signal</span><h2>Coin contracts trade at a premium that drifts slowly, and the model removes it</h2>

      ${lineChart(series, {W: 760, H: 280, xType: "date", xFmt: fmon, tipX: v => fdate(new Date(v).toISOString().slice(0, 10)), yFmt: v => v + " bp", tipY: v => bp(v), zero: true, endLabels: true,

  }

    <ul class="note" style="margin:0;padding-left:18px;display:grid;gap:4px">
      <li><b>Null world:</b> on synthetic data with no relative value, the strategy must show no edge. Profit there would mean a look-ahead or costing bug.</li>
      <li><b>Known truth:</b> a synthetic world with an injected premium and dislocation, which the model must recover.</li>
      <li><b>No look-ahead:</b> cutting off future data must not change any past signal.</li>

function yearCard(R) {
  const ys = R.by_year, W = 420, H = 230, pl = 46, pr = 12, pt = 14, pb = 28;
  const vals = ys.map(y => y.net_bp), t = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4), y0 = t[0], y1 = t[t.length - 1];
  const Y = v => pt + (H - pt - pb) * (y1 - v) / (y1 - y0), bw = (W - pl - pr) / ys.length;
  let g = t.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${v} bp</text>`).join("");
  ys.forEach((y, i) => {
    const x = pl + i * bw + 6, top = Math.min(Y(y.net_bp), Y(0)), h = Math.max(1, Math.abs(Y(y.net_bp) - Y(0)));
    const tipd = tipAttr(String(y.year), [{value: bp(y.net_bp), label: "net per trade"}, {value: bp(y.gross_bp), label: "gross per trade"}, {value: String(y.n), label: "trades"}, {value: inr(y.net_pnl), label: "net P&L"}]);
    g += `<g${tipd}><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/><rect x="${x}" y="${top}" width="${bw - 12}" height="${h}" rx="3" style="fill:var(${y.net_bp >= 0 ? "--pos" : "--neg"})"/></g>`;
    g += `<text class="lbl" x="${x + (bw - 12) / 2}" y="${y.net_bp >= 0 ? top - 6 : top + h + 14}" text-anchor="middle">${num(y.net_bp, 1)}</text>`;
    g += `<text x="${x + (bw - 12) / 2}" y="${H - pb + 18}" text-anchor="middle">${y.year}</text>`;
  });
  g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<div class="card"><header><span class="q">4 · Is it stable?</span><h2>Net per trade, by entry year</h2><p>Only 2022 was positive. GOLDTEN pairs exist only from 2025.</p></header>
    ${legend([{name: "positive", color: "--pos", kind: "box"}, {name: "negative", color: "--neg", kind: "box"}])}
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net basis points per trade by entry year">${g}</svg></div>
    ${tableView(["year", "trades", "gross bp", "net bp", "net P&L"], ys.map(y => [y.year, y.n, num(y.gross_bp, 1), num(y.net_bp, 1), inr(y.net_pnl)]))}</div>`;
}
function exitCard(R, p) {
  const ex = R.exit_reasons || {}, tot = Object.values(ex).reduce((a, b) => a + b, 0) || 1;
  const order = [["stop", "stopped out", "--s2"], ["converged", "converged", "--s1"], ["calendar", "expiry runway", "--s3"], ["max_holding", "held too long", "--o2"]];
  const parts = order.filter(o => ex[o[0]]);
  return `<div class="card"><header><span class="q">Why trades end</span><h2>Half the trades are stopped out</h2>
    <p>A spread that keeps widening after entry hits the stop. Contracts nearing expiry force the rest out before convergence.</p></header>
    ${legend(parts.map(o => ({name: o[1], color: o[2], kind: "box"})))}
    <div class="prop" role="img" aria-label="${esc(parts.map(o => o[1] + " " + ex[o[0]]).join(", "))}">${parts.map(o => `<div style="flex:${ex[o[0]]};background:var(${o[2]})"${tipAttr(o[1], [{value: String(ex[o[0]]), label: "trades"}, {value: pct(ex[o[0]] / tot), label: "of all"}])}>${ex[o[0]] / tot > 0.12 ? ex[o[0]] : ""}</div>`).join("")}</div>
    <dl class="kv">${parts.map(o => `<dt>${esc(o[1])}</dt><dd>${ex[o[0]]} trades · ${pct(ex[o[0]] / tot)}</dd>`).join("")}
      <dt>average holding</dt><dd>${num(p.mean_sessions_held, 1)} sessions</dd></dl></div>`;
}

    </div></section>
  ${eq.length ? `<section class="card"><header><h2>Cumulative net P&amp;L</h2><p>After all costs, marked to market daily. ₹ lakh.</p></header>
    ${lineChart([{name: "net P&L", color: "--s1", values: eq.map(x => [ms(x.date), x.equity])}], {W: 760, H: 280, xType: "date", xFmt: fmon, tipX: v => fdate(new Date(v).toISOString().slice(0, 10)), yFmt: v => (v / 1e5).toFixed(1), tipY: v => lakh(v), zero: true, aria: "Cumulative net profit and loss over time"})}</section>` : ""}
  ${R.by_pair ? `<section class="card"><header><h2>By pair</h2></header><div class="tw"><table><tr><th>Pair</th><th class="num">Trades</th><th class="num">Gross per trade</th><th class="num">Net per trade</th><th class="num">Net hit rate</th><th class="num">Net P&amp;L</th></tr>
    ${R.by_pair.map(r => `<tr><td><b>${esc(r.pair)}</b></td><td class="num">${r.n}</td><td class="num">${bp(r.gross_bp)}</td><td class="num ${r.net_bp < 0 ? "neg" : ""}">${bp(r.net_bp)}</td><td class="num">${pct(r.hit_rate_net)}</td><td class="num">${inr(r.net_pnl)}</td></tr>`).join("")}</table></div></section>` : ""}
  <section class="card"><header><h2>Trades</h2><p>Most recent first.</p></header><div class="tw"><table><tr><th>Pair</th><th>Entry</th><th>Exit</th><th class="num">Lots</th><th class="num">Entry z</th><th class="num">Gross</th><th class="num">Net</th><th>Exit</th></tr>
    ${(B.trades || []).map(t => `<tr><td><b>${esc(t.pair)}</b></td><td>${fdate(t.entry_date)}</td><td>${fdate(t.exit_date)}</td><td class="num">${t.lots_a} / ${t.lots_b}</td><td class="num">${num(t.entry_z)}</td><td class="num">${bp(t.gross_bp)}</td><td class="num ${t.net_bp < 0 ? "neg" : ""}">${bp(t.net_bp)}</td><td>${esc(t.exit_reason)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No trades.</td></tr>`}</table></div>
    ${p.tstat_caveat ? `<p class="note">${esc(p.tstat_caveat)}</p>` : ""}</section>`;
};

V.data = async () => {
  const [R, q, h] = await Promise.all([once("/api/research"), once("/api/data-quality"), once("/api/health")]);
  const flags = Object.entries(q.flags || {}).filter(([k]) => k !== "symbol_unknown_or_filtered");
  return `<section class="hero"><h1>${(q.rows_out || 0).toLocaleString("en-IN")} validated contract-days</h1>
    <p class="lede">From ${(q.rows_in || 0).toLocaleString("en-IN")} raw bhavcopy rows (all MCX commodities). Every problem becomes a flag on the row; nothing is silently dropped or repaired.</p></section>
  <section class="card"><header><h2>Coverage</h2><p>GOLDTEN only lists from ${fdate((R.coverage || []).find(x => x.symbol === "GOLDTEN")?.first)}, so its pairs rest on much less history.</p></header><div class="tw"><table>
    <tr><th>Contract</th><th>First</th><th>Last</th><th class="num">Sessions</th><th class="num">Expiries</th><th class="num">No-trade or derived settles</th></tr>
    ${(R.coverage || []).map(c => `<tr><td><b>${esc(c.symbol)}</b></td><td>${fdate(c.first)}</td><td>${fdate(c.last)}</td><td class="num">${c.sessions.toLocaleString("en-IN")}</td><td class="num">${c.contracts}</td><td class="num">${(c.untradeable_rows ?? 0).toLocaleString("en-IN")}</td></tr>`).join("")}
  </table></div></section>
  <section class="grid2">
    <div class="card"><header><h2>Flags raised</h2><p>Rows kept and marked, so results can say how much data they stand on.</p></header><table>
      ${flags.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="num">${Number(v).toLocaleString("en-IN")}</td></tr>`).join("") || `<tr><td class="muted">none</td></tr>`}</table></div>
    <div class="card"><header><h2>Provenance</h2></header><dl class="kv">
      <dt>source</dt><dd>${esc(h.source)}${h.source === "csv" ? " (MCX bhavcopy via mtf.trading)" : ""}</dd>
      <dt>as of</dt><dd>${fdate(h.asof)}</dd><dt>built</dt><dd>${esc(new Date(h.generated_at).toLocaleString("en-IN", {dateStyle: "medium", timeStyle: "short"}))}</dd>
      <dt>run</dt><dd class="mono">${esc(q.run_id)}</dd><dt>input hash</dt><dd class="mono" style="word-break:break-all">${esc(q.data_fingerprint)}</dd>
      <dt>margin parameters</dt><dd>${esc(R.meta.span_parameters)}</dd></dl>
      <p class="note">Margin figures use assumed SPAN parameters until real MCXCCL risk files are loaded with scripts/load_risk_params.py.</p></div>
  </section>`;
};

// ------------------------------------------------------------------ router
async function render() {
  const [r, arg] = (location.hash.replace("#/", "") || "findings").split("/");
  const route = V[r] ? r : "findings";
  document.querySelectorAll("#nav a").forEach(a => {
    const on = a.dataset.r === route || (route === "pair" && a.dataset.r === "today");
    a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  hideTip();
  for (const k in CHARTS) delete CHARTS[k];
  try { $("#view").innerHTML = await V[route](arg); }
  catch (e) { $("#view").innerHTML = `<div class="err"><b>Could not load this view.</b><br>${esc(e.message)}<br><span class="note">API: ${esc(API || location.origin)}. If no snapshot exists yet, run scripts/nightly.py.</span></div>`; }
  scrollTo(0, 0);
}
async function boot() {
  try {
    const h = await once("/api/health");
    const pill = h.sample_data ? `<span class="pill sample">sample data</span>` : `<span class="pill real">MCX data</span>`;
    $("#meta").innerHTML = `${pill}<span>as of ${esc(fdate(h.asof))}</span><span class="mono">${esc(h.run_id)}</span>`;
  } catch (e) { $("#meta").textContent = "API unreachable: " + e.message; }
  render();
}
addEventListener("hashchange", render);
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) location.hash = "#/" + g.dataset.go; });
document.addEventListener("keydown", e => { if (e.key === "Enter") { const g = e.target.closest && e.target.closest("tr[data-go]"); if (g) location.hash = "#/" + g.dataset.go; } });
boot();
</script>
</body>
