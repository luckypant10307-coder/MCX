<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Spread Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell. Dark navigation rail, light working surface, one task per page. */
:root {
  color-scheme: light;
  --rail: #0f172a; --rail-2: #1e293b; --rail-ink: #cbd5e1; --rail-muted: #94a3b8; --rail-line: #1f2a3d;
  --page: #f5f6f8; --card: #ffffff; --ink: #0f172a; --ink-2: #475569; --muted: #64748b;
  --line: #e5e7eb; --line-2: #eef0f3; --hover: #f8fafc;
  --gold: #d97a1e; --gold-ink: #a4500b; --gold-bg: #fdf3e6;
  --good: #15803d; --good-bg: #ecfdf3; --good-line: #bbf7d0;
  --warn: #b45309; --warn-bg: #fff7e6; --warn-line: #fcd9a6;
  --bad: #b91c1c; --bad-bg: #fef2f2; --bad-line: #fecaca;
  --quiet-bg: #f1f5f9; --quiet: #475569;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --o1: #86b6ef; --o2: #5598e7; --o3: #256abf; --o4: #104281;
  --pos: #2a78d6; --neg: #e34948;
  --band: rgba(100,116,139,0.12);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0f17; --card: #131a26; --ink: #e5e7eb; --ink-2: #b6c0cf; --muted: #8b97a8;
    --line: #243044; --line-2: #1b2433; --hover: #172131;
    --gold-bg: #33240f; --gold-ink: #f0b264;
    --good: #4ade80; --good-bg: #0f2a1a; --good-line: #14532d;
    --warn: #fbbf24; --warn-bg: #2b2110; --warn-line: #5b4310;
    --bad: #f87171; --bad-bg: #2c1515; --bad-line: #5f1d1d;
    --quiet-bg: #1e293b; --quiet: #b6c0cf;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --o1: #184f95; --o2: #2a78d6; --o3: #5598e7; --o4: #9ec5f4;
    --pos: #3987e5; --neg: #e66767; --band: rgba(148,163,184,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0f17; --card: #131a26; --ink: #e5e7eb; --ink-2: #b6c0cf; --muted: #8b97a8;
  --line: #243044; --line-2: #1b2433; --hover: #172131;
  --gold-bg: #33240f; --gold-ink: #f0b264;
  --good: #4ade80; --good-bg: #0f2a1a; --good-line: #14532d;
  --warn: #fbbf24; --warn-bg: #2b2110; --warn-line: #5b4310;
  --bad: #f87171; --bad-bg: #2c1515; --bad-line: #5f1d1d;
  --quiet-bg: #1e293b; --quiet: #b6c0cf;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --o1: #184f95; --o2: #2a78d6; --o3: #5598e7; --o4: #9ec5f4;
  --pos: #3987e5; --neg: #e66767; --band: rgba(148,163,184,0.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14.5px/1.5 var(--font); display: flex; }
a { color: inherit; }

/* rail */
aside { width: 248px; flex: none; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column;
  padding: 18px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); height: 100vh; position: sticky; top: 0; }
.brand { display: flex; gap: 11px; align-items: center; padding: 2px 6px 18px; border-bottom: 1px solid var(--rail-line); margin-bottom: 14px; }
.logo { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(135deg, #f2c14e, #d97a1e); color: #1a1205;
  display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.brand b { display: block; color: #fff; font-size: 15.5px; line-height: 1.25; }
.brand small { color: var(--rail-muted); font-size: 12px; }
nav { display: grid; gap: 3px; }
nav a { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 8px; color: var(--rail-ink);
  text-decoration: none; font-weight: 500; }
nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
nav a:hover { background: var(--rail-2); color: #fff; }
nav a.on { background: #24324a; color: #fff; font-weight: 600; }
nav .cnt { margin-left: auto; min-width: 20px; text-align: center; border-radius: 10px; padding: 0 6px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--gold); }
nav .cnt.calm { background: #334155; color: var(--rail-ink); }
.foot { margin-top: auto; border-top: 1px solid var(--rail-line); padding: 12px 6px 0; font-size: 12px; color: var(--rail-muted); line-height: 1.55; }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
.topbar { min-height: 64px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px 14px; padding-block: 10px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
.dpill { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 3px 9px; }
.dpill.real { background: var(--good-bg); color: var(--good); }
.dpill.sample { background: var(--gold-bg); color: var(--gold-ink); }
.run { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.run .mono { color: var(--ink-2); }
.datechip { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 600; color: var(--ink); background: var(--card); white-space: nowrap; }
#view { flex: 1; overflow: auto; padding-block: 24px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; align-content: start; }

/* building blocks */
.kpis { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-width: 0; }
.kpi .l { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 2px; line-height: 1.15; }
.kpi .s { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.card h2 { font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; letter-spacing: -0.01em; }
.card h2 small { font-size: 13px; font-weight: 400; color: var(--muted); }
.card p { margin: 0; }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.grid2.wide { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
td.nw, th.nw { white-space: nowrap; }
.grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.note { font-size: 13px; color: var(--muted); max-width: 90ch; }
.banner { border-radius: 10px; padding: 12px 16px; background: var(--gold-bg); color: var(--gold-ink); }
.banner b { color: inherit; }
.banner.info { background: var(--quiet-bg); color: var(--ink-2); }
.verdict { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-radius: 10px; padding: 12px 16px;
  background: var(--bad-bg); border: 1px solid var(--bad-line); }
.verdict.ok { background: var(--good-bg); border-color: var(--good-line); }
.verdict .t { display: flex; gap: 10px; align-items: center; }
.ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; flex: none; }
.ico.good { background: var(--good); } .ico.bad { background: var(--bad); } .ico.off { background: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: 600 13px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.go { cursor: pointer; } tr.go:hover td { background: var(--hover); }
td b { font-weight: 700; }
.sub { font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 3px 8px; white-space: nowrap; text-transform: uppercase; }
.chip.ALERT, .chip.TRADED, .chip.GREEN, .chip.LOADED, .chip.ok { background: var(--good-bg); color: var(--good); }
.chip.NO_TRADE, .chip.YELLOW, .chip.SIGNAL { background: var(--warn-bg); color: var(--warn); }
.chip.RED, .chip.REJECTED_DATE, .chip.UNREADABLE { background: var(--bad-bg); color: var(--bad); }
.chip.QUIET, .chip.WARMUP { background: var(--quiet-bg); color: var(--quiet); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.checks { display: grid; }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 4px 12px; padding: 12px 6px; border-bottom: 1px solid var(--line-2); }
.check:last-child { border-bottom: 0; }
.check.fail { background: var(--bad-bg); border-radius: 8px; }
.check .ico { margin-top: 1px; }
.check b { font-weight: 700; }
.check .d { grid-column: 2; font-size: 13px; color: var(--ink-2); }
.decision { border-radius: 12px; padding: 14px 16px; border: 2px solid var(--good); background: var(--good-bg); display: grid; gap: 6px; }
.decision.no { border-color: var(--warn); background: var(--warn-bg); }
.decision.quiet { border-color: var(--line); background: var(--quiet-bg); }
.decision .h { font-weight: 800; letter-spacing: .03em; text-transform: uppercase; font-size: 13.5px; color: var(--good); }
.decision.no .h { color: var(--warn); } .decision.quiet .h { color: var(--ink-2); }
.leg { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.decomp { display: flex; height: 40px; border-radius: 8px; overflow: hidden; gap: 2px; font-size: 13px; font-weight: 700; }
.decomp div { display: flex; align-items: center; padding: 0 12px; white-space: nowrap; overflow: hidden; min-width: 0; }
.decomp .n { background: var(--quiet-bg); color: var(--ink-2); }
.decomp .x { background: var(--gold); color: #fff; }
.decomp .x.calm { background: var(--gold-bg); color: var(--gold-ink); }
.tg { background: var(--quiet-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font: 13px/1.7 var(--mono); white-space: pre-wrap; margin: 0; color: var(--ink); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 17px var(--font); cursor: pointer; }
.stepper button:hover { background: var(--hover); }
.stepper output { min-width: 56px; text-align: center; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.params td:first-child { width: 34%; }
.zt { position: relative; height: 18px; min-width: 130px; }
.zt .track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line); }
.zt .zone { position: absolute; top: 4px; height: 10px; background: var(--gold-bg); border-radius: 2px; }
.zt .mid { position: absolute; top: 3px; width: 1px; height: 12px; background: var(--muted); }
.zt .dot { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink-2); box-shadow: 0 0 0 2px var(--card); }
.zt .dot.hot { background: var(--gold); }
.prop { display: flex; height: 28px; border-radius: 6px; overflow: hidden; gap: 2px; }
.prop div { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; min-width: 0; }
.tiles { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* charts */
.chart { position: relative; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font: 11px var(--font); fill: var(--muted); }
.chart .lbl { font-size: 12px; fill: var(--ink-2); font-weight: 600; }
.chart .grid { stroke: var(--line-2); } .chart .axis { stroke: var(--line); }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .xh { stroke: var(--ink-2); opacity: .5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend i.dash { border-top-style: dashed; } .legend i.dot { width: 9px; height: 9px; border-radius: 50%; border: 0; } .legend i.box { width: 12px; height: 10px; border: 0; border-radius: 2px; }
details { font-size: 13px; } summary { cursor: pointer; color: var(--ink-2); width: fit-content; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: #0f172a; color: #fff; border-radius: 8px; padding: 8px 11px; font-size: 13px; line-height: 1.45;
  max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.tip .h { color: #cbd5e1; font-size: 12px; margin-bottom: 3px; }
.tip .r { display: flex; align-items: center; gap: 8px; } .tip .r span { color: #cbd5e1; }
.tip .r i { width: 12px; height: 0; border-top: 2px solid; flex: none; }
.err { padding: 18px; border-radius: 12px; background: var(--bad-bg); border: 1px solid var(--bad-line); }
.empty { color: var(--muted); padding: 8px 0; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* narrow screens: the rail becomes a top bar */
@media (max-width: 1100px) { .kpis, .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .grid2.even, .grid2.wide { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  body { display: block; }
  aside { width: auto; height: auto; position: sticky; top: 0; z-index: 10; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .brand { border: 0; padding: 0 0 8px; margin: 0; }
  nav { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; }
  nav a { padding: 7px 10px; white-space: nowrap; } nav a svg { display: none; }
  .foot { display: none; }
  .main { height: auto; }
  .topbar, #view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #view { overflow: visible; }
  .run { margin-left: 0; width: 100%; }
  .kpi .v { font-size: 24px; }
}
@media (max-width: 620px) { .chart svg { min-width: 600px; } }
</style>
</head>

<script>
// API base: same origin by default; override with ?api=https://your-api.example
const API = (new URLSearchParams(location.search).get("api") || window.MCX_API || "").replace(/\/$/, "");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fin = v => v != null && Number.isFinite(Number(v));
const bp = (v, d = 1) => fin(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + " bp" : "–";
const num = (v, d = 2) => fin(v) ? (v < 0 ? "−" : "") + Math.abs(v).toFixed(d) : "–";
const inr = v => fin(v) ? (v < 0 ? "−₹" : "₹") + Math.abs(Math.round(v)).toLocaleString("en-IN") : "–";
const lakh = v => fin(v) ? (v < 0 ? "−" : "") + "₹" + (Math.abs(v) / 1e5).toFixed(2) + " L" : "–";
const pct = (v, d = 0) => fin(v) ? (v * 100).toFixed(d) + "%" : "–";
const int = v => fin(v) ? Math.round(v).toLocaleString("en-IN") : "–";
// Indian units for big counts: 1,90,495 -> 1.9 L, 34,736 -> 34.7 K.
const compact = v => !fin(v) ? "–" : v >= 1e5 ? (v / 1e5).toFixed(1) + " L" : v >= 1e3 ? (v / 1e3).toFixed(1) + " K" : int(v);
const fdate = d => d ? new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}) : "–";
const fexp = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day: "2-digit", month: "short"}).toUpperCase() : "–";
const fmon = ms => new Date(ms).toLocaleDateString("en-GB", {month: "short", year: "2-digit"});
const ms = d => new Date(d + "T00:00:00").getTime();
const isoOf = v => new Date(v).toISOString().slice(0, 10);
const vs = p => p.replace("/", " vs ");
const chip = (s, label) => `<span class="chip ${esc(s)}">${esc(label || String(s).replace("_", " "))}</span>`;
const pairUrl = p => p.replace("/", "-");

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status + " " + r.statusText);

function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const t = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-9; v += step) t.push(+v.toFixed(10));
  if (t[0] > lo) t.unshift(t[0] - step);
  if (t[t.length - 1] < hi) t.push(t[t.length - 1] + step);
  return t;
}
function dateTicks(a, b) {

  const months = (b - a) / 2.63e9, step = months > 40 ? 12 : months > 18 ? 6 : months > 8 ? 3 : 1;
  d.setMonth(Math.ceil(d.getMonth() / step) * step);

}
const CHARTS = {};

  const xs = [...new Set(series.flatMap(s => s.values.map(v => v[0])))].sort((a, b) => a - b);
  if (!xs.length) return `<p class="empty">No data.</p>`;
  let ylo = Math.min(...pts.map(p => p[1]), ...(o.refs || []).map(r => r.y)), yhi = Math.max(...pts.map(p => p[1]), ...(o.refs || []).map(r => r.y));
  if (o.zero) { ylo = Math.min(ylo, 0); yhi = Math.max(yhi, 0); }

  const path = vals => vals.map((v, i) => (i ? "L" : "M") + X(v[0]).toFixed(1) + "," + Y(v[1]).toFixed(1)).join("");
  const yFmt = o.yFmt || (v => v), xFmt = o.xFmt || (v => v);
  let g = "";
  for (const t of yt) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
  for (const t of o.xTicks || (o.xType === "date" ? dateTicks(x0, x1) : xs)) g += `<text x="${X(t)}" y="${H - pb + 18}" text-anchor="middle">${esc(xFmt(t))}</text>`;
  g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>`;
  if (o.zero && y0 < 0 && y1 > 0) g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (o.xLabel) g += `<text x="${pl + (W - pl - pr) / 2}" y="${H - 6}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  if (o.band) {
    const up = o.band.hi.map(v => X(v[0]).toFixed(1) + "," + Y(v[1]).toFixed(1));

    g += `<path d="${path(s.values)}" fill="none" style="stroke:var(${s.color})" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ""}/>`;

const ENTRY_SESSIONS = 15;     // BacktestConfig.min_sessions_to_expiry_entry
function pairChecks(p) {
  const g = p.gates || {}, r = p.risk || {}, legs = p.legs || [];

  const marginOk = /^(may add|add reduced size)$/.test(r.action || "") ? true : r.action === "no signal" ? fundable : r.action ? false : null;
  return [
    {k: "History", ok: g.gate_history, d: g.gate_history ? "enough trailing sessions to score this pair" : "not enough history to score yet"},
    {k: "Mean-reverting", ok: g.gate_stationary, d: `ADF t ${num(p.adf_t)} (needs below −2.57)` + (g.gate_stationary ? "" : " · spread drifts instead of reverting")},
    {k: "Half-life", ok: g.gate_halflife, d: `${fin(p.halflife) ? num(p.halflife, 1) + " sessions" : "∞"} to close half the gap (limit 30)`},
    {k: "Size", ok: g.gate_magnitude, d: `|z| ${num(Math.abs(p.z))} vs ${p.z_entry ?? 2}; extra ${bp(p.dislocation_bp)} vs 15 bp minimum and the noise floor`},

    {k: "Lifecycle", ok: Number.isFinite(minLeft) ? minLeft >= ENTRY_SESSIONS : null, d: Number.isFinite(minLeft) ? `${minLeft} sessions to the nearer expiry (need ${ENTRY_SESSIONS}); exit before tender` + (legs.some(l => l.front_month === false) ? ". Priced in the next contract: the front month is too close to expiry to enter." : "") : "no contract with enough runway to enter"},
    {k: "Margin", ok: marginOk, d: r.action ? `${inr(r.marginal_margin)} if added · ${pct(r.utilisation_if_added, 1)} of capital · buffer ${esc(r.buffer_state || "–")}${r.action !== "no signal" ? " · " + esc(r.action) + (r.reason ? ", " + esc(r.reason) : "") : ""}` : "not priced"},

}

V.research = async () => {
  const R = await once("/api/research"), p = R.performance || {}, c = R.costs || {}, w = R.window || {}, es = R.event_study, ok = R.verdict && R.verdict.edge_survives_costs;

  let html = `<div class="verdict ${ok ? "ok" : ""}"><div class="t"><span class="ico ${ok ? "good" : "bad"}" aria-hidden="true">${ok ? "✓" : "✕"}</span><div><b>${ok ? "An edge survives costs." : "The dislocation is real. The edge does not survive costs."}</b> ${esc(R.verdict.headline)} · ${int(w.sessions)} sessions, ${fdate(w.start)} to ${fdate(w.end)}.</div></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Gross per trade</div><div class="v">${bp(c.gross_bp)}</div><div class="s">what convergence paid</div></div>
    <div class="kpi"><div class="l">Costs per trade</div><div class="v">${fin(cost) ? cost.toFixed(1) + " bp" : "–"}</div><div class="s">fees, taxes, spread, slippage</div></div>
    <div class="kpi"><div class="l">Net per trade</div><div class="v ${c.net_bp < 0 ? "c-bad" : "c-good"}">${bp(c.net_bp)}</div><div class="s">${p.n_trades} trades · hit rate ${pct(p.hit_rate_net)}</div></div>
    <div class="kpi"><div class="l">Breakeven spread</div><div class="v">${num(c.breakeven_half_spread_bp, 1)} bp</div><div class="s">per leg, per crossing</div></div>
  </div>`;
  if (es && es.rows && es.rows.length) {
    const BANDS = [["|z| 0-1", "|z| below 1", "--o1"], ["|z| 1-2", "|z| 1 to 2", "--o2"], ["|z| 2-3", "|z| 2 to 3", "--o3"], ["|z| 3-inf", "|z| 3 and above", "--o4"]];
    const hz = [...new Set(es.rows.map(r => r.horizon))].sort((a, b) => a - b);
    const series = BANDS.map(([k, name, color]) => ({name, label: name.replace("|z| ", ""), color, markers: true, values: es.rows.filter(r => r.z_band === k).map(r => [r.horizon, r.mean_conv_bp])}));
    const top = es.rows.filter(r => r.z_band === "|z| 3-inf"), clears = es.rows.filter(r => r.ci_clears_costs);
    html += `<div class="card"><h2>1 · Wide spreads do close, and wider ones close further</h2>
      <p class="note">Average convergence after a dislocation, by |z| band and sessions waited. Every pair-day counts, tradable or not. Shaded: 95% bootstrap interval for |z| ≥ 3. Dashed: round-trip cost at a ${es.half_spread_bp} bp spread.</p>
      ${legend(series.map(s => ({name: s.name, color: s.color})).concat([{name: "round-trip cost", color: "--ink-2", kind: "dash"}]))}
      ${lineChart(series, {W: 820, H: 320, xTicks: hz, tipX: v => "after " + v + " session" + (v === 1 ? "" : "s"), yFmt: v => v + " bp", tipY: v => bp(v), refs: [{y: es.round_trip_bp, label: "cost " + es.round_trip_bp.toFixed(0) + " bp"}], zero: true, xLabel: "sessions held",
        band: {lo: top.map(r => [r.horizon, r.boot_ci_lo]), hi: top.map(r => [r.horizon, r.boot_ci_hi]), color: "--band"}, endLabels: true, aria: "Mean convergence by horizon for four |z| bands with the cost line"})}
      <p>${clears.length ? `Only ${clears.map(r => "|z| ≥ 3 held " + r.horizon + " sessions").join(", ")} clears the cost line with 95% confidence.` : "No band clears the cost line with 95% confidence."} The backtest rarely holds that long: ${R.exit_reasons ? (R.exit_reasons.stop || 0) : "–"} of ${p.n_trades} trades were stopped out first.</p>
      ${tableView(["band", "sessions", "n", "mean bp", "95% CI", "NW t", "net of cost"], es.rows.map(r => [r.z_band, r.horizon, r.n, num(r.mean_conv_bp, 1), num(r.boot_ci_lo, 1) + " to " + num(r.boot_ci_hi, 1), num(r.t_newey_west), num(r.net_conv_bp, 1)]))}</div>`;
  }
  if (c.sweep && c.sweep.length && fin(c.gross_bp)) {
    const stat = c.sweep[0].statutory_bp, per = (c.sweep[0].round_trip_bp - stat) / c.sweep[0].half_spread_bp_per_leg;
    html += `<div class="grid2 even"><div class="card"><h2>2 · Costs pass the gross edge almost immediately</h2>
      <p class="note">Four bid-ask crossings per trade. Statutory charges alone are ${stat.toFixed(1)} bp; the spread itself is not in bhavcopy, so cost is shown as it widens.</p>
      ${legend([{name: "round-trip cost", color: "--s1"}, {name: "gross edge per trade", color: "--ink-2", kind: "dash"}])}
      ${lineChart([{name: "round-trip cost", color: "--s1", values: [0, 1, 2, 3, 4, 5, 6, 8, 10].map(x => [x, stat + per * x])}], {W: 520, H: 260, xTicks: [0, 2, 4, 6, 8, 10], xFmt: v => v + " bp", tipX: v => "half-spread " + v + " bp per leg", yFmt: v => v + " bp", tipY: v => num(v, 1) + " bp", refs: [{y: c.gross_bp, label: "gross " + c.gross_bp.toFixed(1) + " bp"}], zero: true, xLabel: "assumed half-spread per leg", aria: "Round-trip cost against assumed half-spread"})}
      <p>They cross at <b>${num(c.breakeven_half_spread_bp, 1)} bp per leg</b>.</p></div>
      ${premiumCard(R)}</div>`;
  }
  if (R.by_year) html += `<div class="grid2 even">${yearCard(R)}${exitCard(R, p)}</div>`;
  html += `<div class="card"><h2>How the engine is kept honest <small>run on every push</small></h2><div class="checks">
    ${[["Null world", "On synthetic data with no relative value, the strategy must show no edge."], ["Known truth", "A synthetic world with an injected premium and dislocation, which the model must recover."], ["No look-ahead", "Cutting off future data must not change any past signal."], ["Next-session fills", "A signal from today's settlement is filled tomorrow, never at the price that produced it."]].map(([k, d]) => checkRow({k, ok: true, d})).join("")}</div></div>`;
  return html;
};
function premiumCard(R) {
  const PREM = [["GOLDGUINEA", "--s1"], ["GOLDPETAL", "--s2"], ["GOLDTEN", "--s3"]];
  const series = PREM.map(([s, color]) => ({name: s, color, values: (R.premiums || []).filter(r => r.symbol === s && fin(r.premium_bp)).map(r => [ms(r.date), r.premium_bp])})).filter(s => s.values.length);
  if (!series.length) return "";
  return `<div class="card"><h2>3 · Coin premiums drift slowly, and are removed</h2>
    <p class="note">Premium over the GOLDM 995 bar, re-estimated weekly from the previous 120 sessions. It moves over months; left in, it would swamp the 20–70 bp dislocations being traded.</p>
    ${legend(series.map(s => ({name: s.name, color: s.color})))}
    ${lineChart(series, {W: 520, H: 260, xType: "date", xFmt: fmon, tipX: v => fdate(isoOf(v)), yFmt: v => v + " bp", tipY: v => bp(v), zero: true, endLabels: true, aria: "Coin premiums over time"})}</div>`;
}
function yearCard(R) {
  const ys = R.by_year, W = 460, H = 230, pl = 46, pr = 12, pt = 16, pb = 28;
  const vals = ys.map(y => y.net_bp), t = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4), y0 = t[0], y1 = t[t.length - 1];
  const Y = v => pt + (H - pt - pb) * (y1 - v) / (y1 - y0), bw = (W - pl - pr) / ys.length;
  let g = t.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${v} bp</text>`).join("");
  ys.forEach((y, i) => {
    const x = pl + i * bw + 8, top = Math.min(Y(y.net_bp), Y(0)), h = Math.max(1, Math.abs(Y(y.net_bp) - Y(0)));
    g += `<g${tipAttr(String(y.year), [{value: bp(y.net_bp), label: "net per trade"}, {value: bp(y.gross_bp), label: "gross"}, {value: String(y.n), label: "trades"}, {value: inr(y.net_pnl), label: "net P&L"}])}><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/><rect x="${x}" y="${top}" width="${bw - 16}" height="${h}" rx="3" style="fill:var(${y.net_bp >= 0 ? "--pos" : "--neg"})"/></g>`;
    g += `<text class="lbl" x="${x + (bw - 16) / 2}" y="${y.net_bp >= 0 ? top - 6 : top + h + 14}" text-anchor="middle">${num(y.net_bp, 1)}</text><text x="${x + (bw - 16) / 2}" y="${H - pb + 18}" text-anchor="middle">${y.year}</text>`;
  });
  g += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<div class="card"><h2>4 · Net per trade, by entry year</h2><p class="note">Only 2022 was positive. GOLDTEN pairs exist only from 2025.</p>
    ${legend([{name: "positive", color: "--pos", kind: "box"}, {name: "negative", color: "--neg", kind: "box"}])}
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net basis points per trade by entry year">${g}</svg></div>
    ${tableView(["year", "trades", "gross bp", "net bp", "net P&L"], ys.map(y => [y.year, y.n, num(y.gross_bp, 1), num(y.net_bp, 1), inr(y.net_pnl)]))}</div>`;
}
function exitCard(R, p) {
  const ex = R.exit_reasons || {}, tot = Object.values(ex).reduce((a, b) => a + b, 0) || 1;
  const parts = [["stop", "stopped out", "--s2"], ["converged", "converged", "--s1"], ["calendar", "expiry runway", "--s3"], ["max_holding", "held too long", "--o2"]].filter(o => ex[o[0]]);
  return `<div class="card"><h2>Why trades end</h2><p class="note">A spread that keeps widening hits the stop; contracts nearing expiry force the rest out before convergence.</p>
    ${legend(parts.map(o => ({name: o[1], color: o[2], kind: "box"})))}
    <div class="prop">${parts.map(o => `<div style="flex:${ex[o[0]]};background:var(${o[2]})"${tipAttr(o[1], [{value: String(ex[o[0]]), label: "trades"}, {value: pct(ex[o[0]] / tot), label: "of all"}])}>${ex[o[0]] / tot > .12 ? ex[o[0]] : ""}</div>`).join("")}</div>
    <table>${parts.map(o => `<tr><td>${esc(o[1])}</td><td class="num">${ex[o[0]]}</td><td class="num">${pct(ex[o[0]] / tot)}</td></tr>`).join("")}<tr><td>average holding</td><td class="num" colspan="2">${num(p.mean_sessions_held, 1)} sessions</td></tr></table></div>`;
}

    <div class="card"><h2>Engine parameters <small>used by this run · read-only</small></h2>
      ${groups.map(g => `<div><div class="sub" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:6px 0 2px">${esc(g)}</div><table class="params">${S.parameters.filter(p => p.group === g).map(p => `<tr><td><b>${esc(p.name)}</b></td><td class="num"><b>${esc(fmt(p))}</b></td><td class="sub">${esc(p.what)}</td></tr>`).join("")}</table></div>`).join("")}
      <p class="note">To change one, re-run the nightly job with the new value, for example <span class="mono">python scripts/nightly.py --source csv --z-entry 2.5</span>. The engine is rule-based; nothing here is learned or tuned by AI.</p></div>
    <div class="card"><h2>What if the threshold changed? <small>counts only</small></h2>
      <div class="stepper"><span style="flex:1"><b>Unusual if |z| ≥</b><div class="sub">this run used ${S.z_entry}</div></span><button data-step="-0.1" aria-label="Lower threshold">−</button><output id="zv">${whatIf.toFixed(1)}</output><button data-step="0.1" aria-label="Raise threshold">+</button></div>
      <div id="wi">${whatIfTable(S)}</div>
      <p class="note">This only counts pair-sessions whose z crosses the threshold, from the stored history. The other gates, the risk board and the backtest need a full re-run to change.</p></div>
  </div>`;
};
function whatIfTable(S) {
  const hist = S.pair_history, pairs = Object.keys(hist);
  const last = Math.max(...pairs.map(k => hist[k].length ? ms(hist[k][hist[k].length - 1].date) : 0));
  let today = 0, total = 0, n = 0;
  for (const k of pairs) for (const r of hist[k]) { if (!fin(r.z)) continue; n++; if (Math.abs(r.z) >= whatIf) { total++; if (ms(r.date) === last) today++; } }
  const sessions = Math.max(...pairs.map(k => hist[k].length));
  return `<table><tr><th></th><th class="num">Today</th><th class="num">Last ${sessions} sessions</th></tr>
    <tr><td>Unusual pair-sessions</td><td class="num"><b>${today}</b></td><td class="num"><b>${total}</b></td></tr>
    <tr><td>Share of all checks</td><td class="num">${pct(today / (pairs.length || 1))}</td><td class="num">${pct(total / (n || 1), 1)}</td></tr></table>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-step]");
  if (b) { whatIf = Math.max(0.5, Math.min(5, Math.round((whatIf + Number(b.dataset.step)) * 10) / 10)); $("#zv").textContent = whatIf.toFixed(1); $("#wi").innerHTML = whatIfTable(await once("/api/settings")); }
});

// ------------------------------------------------------------------ router
async function render() {
  const [r, arg] = (location.hash.replace("#/", "") || "overview").split("/");
  const route = V[r] ? r : "overview";
  $("#ttl").textContent = TITLES[route];
  document.querySelectorAll("#nav a").forEach(a => { const on = a.dataset.r === route || (route === "pair" && a.dataset.r === "pairs"); a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  hideTip();
  for (const k in CHARTS) delete CHARTS[k];
  try { $("#view").innerHTML = await V[route](arg); }
  catch (e) { $("#view").innerHTML = `<div class="err"><b>Could not load this page.</b><br>${esc(e.message)}<br><span class="note">API: ${esc(API || location.origin)}. If no snapshot exists yet, run scripts/nightly.py.</span></div>`; }
  $("#view").scrollTop = 0;
}
async function boot() {
  try {
    const [h, o] = await Promise.all([once("/api/health"), once("/api/overview")]);
    const p = $("#dpill"); p.hidden = false; p.className = "dpill " + (h.sample_data ? "sample" : "real"); p.textContent = h.sample_data ? "SAMPLE DATA" : "MCX DATA";
    const built = new Date(h.generated_at);
    $("#runinfo").innerHTML = `Last run ${esc(built.toLocaleTimeString("en-IN", {timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false}))} IST · run <span class="mono">${esc(h.run_id)}</span>`;
    const dc = $("#datechip"); dc.hidden = false; dc.textContent = h.asof ? new Date(h.asof + "T00:00:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short", year: "numeric"}) : "–";
    $("#foot").innerHTML = `Data: ${h.sample_data ? "synthetic sample in MCX bhavcopy format" : "MCX bhavcopy via mtf.trading"}<br>Engine: rule-based, no AI in the decision<br>Build ${esc(fdate(String(h.generated_at).slice(0, 10)))}`;
    const c = $("#ncnt"); c.hidden = false; c.textContent = o.summary.ALERT; c.classList.toggle("calm", !o.summary.ALERT);
  } catch (e) { $("#foot").textContent = "API unreachable: " + e.message; }
  render();
}
addEventListener("hashchange", render);
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) location.hash = "#/" + g.dataset.go; });
document.addEventListener("keydown", e => { if (e.key === "Enter") { const g = e.target.closest && e.target.closest("tr[data-go]"); if (g) location.hash = "#/" + g.dataset.go; } });
boot();
</script>
</body>
